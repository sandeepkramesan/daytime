<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only this site and Google sign-in may run scripts; data comes only from the Google APIs daytime reads. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://www.googleapis.com https://tasks.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="daytime is a clock and calendar for your day: live local time, date, sunrise and sunset, plus Google Calendar events and tasks for the day you pick." />
    <title>daytime — clock and calendar</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./core.js" defer></script>
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="widget" aria-label="daytime calendar widget">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="daytime home">
          <img src="./logo.svg" width="23" height="23" alt="" />
          <span>daytime</span>
        </a>
        <div class="topbar-actions">
          <button class="icon-button shell-only" id="backButton" type="button" aria-label="Send daytime to the back" title="Send to back" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <button class="icon-button shell-only" id="closeButton" type="button" aria-label="Close daytime" title="Close" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </div>
      </header>

      <section class="date-hero" id="top" aria-label="Selected date and time">
        <div class="day-block">
          <p class="weekday" id="weekday">Saturday</p>
          <p class="day-number" id="dayNumber">31</p>
        </div>
        <div class="date-meta" aria-label="Month, year, and time">
          <p class="month" id="month">October</p>
          <p class="year" id="year">2026</p>
          <p class="year-progress" id="yearProgress">WEEK 44 · DAY 304</p>
          <p class="clock" id="clock" aria-label="Local time">--:--</p>
        </div>
        <div class="sun-panel" aria-label="Sunrise and sunset">
          <div class="sun-row"><span>SUNRISE</span><strong id="sunriseTime">--:--</strong></div>
          <div class="sun-row"><span>SUNSET</span><strong id="sunsetTime">--:--</strong></div>
          <div class="sun-location-row">
            <span class="sun-status" id="sunStatus">LOCATION NEEDED</span>
            <button class="mini-button" id="locationButton" type="button" aria-label="Use this device's location for sunrise and sunset" title="Use this device's location">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
            </button>
          </div>
        </div>
      </section>

      <nav class="calendar" id="calendar" aria-label="Choose a day">
        <button class="month-nav" id="prevMonth" type="button" aria-label="Previous month" title="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="month-grid">
          <div class="week-labels" id="weekLabels" aria-hidden="true">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="month-days" id="monthDays" role="group" aria-label="Days of the month"></div>
        </div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="Next month" title="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </nav>

      <section class="agenda" aria-labelledby="agendaHeading">
        <div class="section-heading">
          <h1 id="agendaHeading">TODAY</h1>
          <div class="heading-actions">
            <button class="today-link" id="todayButton" type="button" hidden>Today</button>
            <a class="calendar-link" id="calendarLink" href="https://calendar.google.com/" target="_blank" rel="noreferrer noopener">Google Calendar</a>
            <button class="mini-button" id="refreshButton" type="button" aria-label="Refresh calendar" title="Refresh calendar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.8-2L20 12M4 12l2.6 5a7 7 0 0 0 11.8-2"/></svg>
            </button>
          </div>
        </div>
        <ul class="holiday-list" id="holidayList" aria-label="Holidays on this day" hidden></ul>
        <div class="agenda-content" id="agendaContent">
          <noscript>
            <section class="status-card">
              <h2>JavaScript is needed</h2>
              <p>daytime keeps the date, clock and calendar in sync in your browser. Enable JavaScript to use it.</p>
            </section>
          </noscript>
        </div>
      </section>

      <footer class="widget-footer">
        <p class="privacy-note">YOUR DAY, AT A GLANCE <span aria-hidden="true">·</span> NOTHING UPLOADED</p>
        <button class="info-button" id="aboutButton" type="button" aria-label="About daytime: connection, location and privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11.2v4.8"/><path d="M12 8.1v.5"/></svg>
        </button>
      </footer>
      <div class="sr-only" id="liveMessage" role="status" aria-live="polite"></div>
    </main>

    <template id="welcomeTemplate">
      <section class="connect-card">
        <h2 tabindex="-1">Connect your calendar</h2>
        <p data-message>See events and tasks for the day you pick. daytime asks Google for read-only access and keeps your sign-in only in memory.</p>
        <button class="action-button" type="button" data-action="connect">Connect Google Calendar <span aria-hidden="true">↗</span></button>
      </section>
    </template>

    <dialog class="sheet" id="connectDialog" aria-labelledby="connectTitle">
      <div class="sheet-inner">
        <header class="sheet-head">
          <h2 id="connectTitle">Connect Google Calendar</h2>
          <button class="icon-button sheet-close" id="closeConnect" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </header>
        <div class="sheet-body" id="connectBody"></div>
      </div>
    </dialog>

    <dialog class="sheet" id="aboutDialog" aria-labelledby="aboutTitle">
      <div class="sheet-inner">
        <header class="sheet-head">
          <h2 id="aboutTitle">About daytime</h2>
          <button class="icon-button sheet-close" id="closeAbout" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </header>
        <div class="sheet-body" id="aboutBody"></div>
      </div>
    </dialog>
  </body>
</html>
